name: Phase 1 static checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check GJS module syntax
        run: |
          node --check extension/extension.js
          node --check extension/canvasMath.js
      - name: Test world-coordinate transformations
        run: node --test tests/canvasMath.test.js
      - name: Validate metadata and SQLite migration
        run: |
          python3 -m json.tool extension/metadata.json > /dev/null
          python3 tests/check_migration.py
      - name: Package extension ZIP
        run: bash scripts/build-extension.sh
      - name: Upload ZIP from PoC
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-board-gnome50-poc
          path: dist/evidence-note-board-gnome50-poc.zip
