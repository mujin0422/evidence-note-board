name: Phase 1 static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: JavaScript syntax
        run: |
          node --check extension/extension.js
          node --check extension/boardView.js
          node --check extension/canvasMath.js
      - name: Camera unit tests
        run: node --test tests/canvasMath.test.js
      - name: Validate metadata and planned database schema
        run: |
          python3 tests/check_extension.py
          python3 tests/check_migration.py
      - name: Package GNOME extension ZIP
        run: |
          bash -n scripts/install-dev.sh scripts/build-extension.sh
          bash scripts/build-extension.sh
          python3 tests/check_extension.py
      - name: Upload PoC ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-board-gnome50-poc
          path: dist/evidence-note-board-gnome50-poc.zip
