name: Native desktop PoC and Rust backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax
        run: |
          node --check extension/extension.js
          node --check extension/boardView.js
          node --check extension/canvasMath.js
          node --check extension/noteService.js
          node --check extension/doubleClickTracker.js
          node --check extension/noteHitTest.js
          node --check extension/noteContent.js
          node --check extension/geometry.js
          node --check extension/pinMath.js
          node --check extension/stringMath.js
      - name: Camera tests
        run: node --test tests/canvasMath.test.js tests/doubleClickTracker.test.js tests/noteHitTest.test.js tests/noteContent.test.js tests/geometry.test.js tests/pinMath.test.js tests/stringMath.test.js
      - name: Schema and metadata
        run: |
          python3 tests/check_migration.py
          python3 tests/check_extension.py
          python3 tests/check_gnome50_api.py
          python3 tests/check_note_editor.py
          python3 tests/check_image_notes.py
          python3 tests/check_phase3_interactions.py
          python3 tests/check_phase4_pin.py
          python3 tests/check_phase4_strings.py
          python3 tests/check_autostart.py
          bash -n scripts/install-dev.sh scripts/install-backend-dev.sh scripts/build-extension.sh scripts/setup-dev.sh
      - name: Package
        run: |
          bash scripts/build-extension.sh
          python3 tests/check_extension.py
      - name: Upload extension ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-board-gnome50-phase2
          path: dist/evidence-note-board-gnome50-phase2.zip

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust tests
        run: cargo test --manifest-path backend/Cargo.toml --all-targets
      - name: D-Bus / SQLite smoke integration
        run: |
          cargo build --manifest-path backend/Cargo.toml
          dbus-run-session -- bash scripts/test-dbus-smoke.sh
      - name: Rust release binary
        run: cargo build --manifest-path backend/Cargo.toml --release
      - name: Upload backend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-boardd-linux-x86_64-ci
          path: backend/target/release/evidence-note-boardd
