name: Native desktop PoC and Rust backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax
        run: |
          node --check extension/extension.js
          node --check extension/ui/boardView.js
          node --check extension/services/noteService.js
          node --check extension/input/doubleClickTracker.js
          node --check extension/input/noteHitTest.js
          node --check extension/input/holdDrag.js
          node --check extension/model/noteContent.js
          node --check extension/model/richText.js
          node --check extension/geometry/canvasMath.js
          node --check extension/geometry/imageSizing.js
          node --check extension/geometry/noteGeometry.js
          node --check extension/geometry/pinMath.js
          node --check extension/geometry/stringMath.js
          node --check extension/geometry/boardBounds.js
          node --check extension/core/runtimePolicy.js
      - name: Camera tests
        run: node --test tests/canvasMath.test.js tests/doubleClickTracker.test.js tests/noteHitTest.test.js tests/noteContent.test.js tests/imageSizing.test.js tests/noteGeometry.test.js tests/pinMath.test.js tests/stringMath.test.js tests/runtimePolicy.test.js tests/boardBounds.test.js tests/richText.test.js tests/holdDrag.test.js tests/boardZoom.test.js tests/boardPan.test.js
      - name: Schema and metadata
        run: |
          python3 tests/check_migration.py
          python3 tests/check_extension.py
          python3 tests/check_gnome50_api.py
          python3 tests/check_note_editor.py
          python3 tests/check_image_notes.py
          python3 tests/check_phase3_interactions.py
          python3 tests/check_phase4_pin.py
          python3 tests/check_phase4_strings.py
          python3 tests/check_phase4_wire_render.py
          python3 tests/check_autostart.py
          python3 tests/check_phase5.py
          python3 tests/check_board_interactions.py
          python3 tests/check_board_pan.py
          python3 tests/check_rich_editor.py
          python3 tests/check_compact_hud_drag.py
          python3 tests/check_rpm_packaging.py
          python3 tests/check_resource_efficiency.py
          python3 -m unittest discover -s tests -p 'test_backup.py'
          bash -n scripts/install-dev.sh scripts/install-backend-dev.sh scripts/build-extension.sh scripts/setup-dev.sh
          node scripts/benchmark-geometry.mjs
      - name: Package
        run: |
          bash scripts/build-extension.sh
          python3 tests/check_extension.py
      - name: Upload extension ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-board-extension-zip
          path: dist/*-gnome50.zip
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust tests
        run: cargo test --manifest-path backend/Cargo.toml --all-targets
      - name: D-Bus / SQLite smoke integration
        run: |
          cargo build --manifest-path backend/Cargo.toml
          dbus-run-session -- bash scripts/test-dbus-smoke.sh
      - name: Rust release binary
        run: cargo build --manifest-path backend/Cargo.toml --release
      - name: Upload backend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-boardd-linux-x86_64-ci
          path: backend/target/release/evidence-note-boardd

  rpm:
    name: Fedora 44 RPM and installation payload
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Fedora build tools
        run: |
          dnf -y install git rust cargo gcc pkgconf-pkg-config sqlite-devel \
            rpm-build rpmdevtools systemd-rpm-macros nodejs python3 \
            tar gzip coreutils findutils cpio which
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build offline RPM from locked vendored source
        run: bash scripts/build-rpm.sh
      - name: Inspect produced RPM metadata and contents
        run: |
          bash scripts/check-built-rpm.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload tested Fedora RPM, SRPM and extension ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-note-board-fedora44-release-candidate
          path: |
            dist/evidence-note-board-[0-9]*.x86_64.rpm
            dist/evidence-note-board-[0-9]*.src.rpm
            dist/*-gnome50.zip
            dist/SHA256SUMS
          if-no-files-found: error
