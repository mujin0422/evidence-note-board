name: Fedora 44 Release

on:
  push:
    tags:
      - 'v*'
  # Re-run the release pipeline for an existing tag without re-tagging,
  # mutating published source or force-pushing history.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated release tag (e.g. v0.2.0)'
        required: true
        type: string

# The tag must be an intentional, stable version. No scheduled publishing.
permissions:
  contents: read

jobs:
  release:
    name: Verify, build and publish tagged release
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    permissions:
      contents: write
    steps:
      - name: Install Fedora build and release tools
        run: |
          dnf -y install git rust cargo gcc pkgconf-pkg-config sqlite-devel \
            rpm-build rpmdevtools systemd-rpm-macros nodejs python3 \
            tar gzip coreutils findutils cpio which gh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          # On manual dispatch, use the existing tagged source commit,
          # not the current dev HEAD. The fixed workflow comes from dev.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Trust only this checked-out workspace for container Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate exact signed-off release version
        env:
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          with open("backend/Cargo.toml","rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          python3 scripts/check-release-version.py "$version" "$VERSION_TAG"
          # For push, GITHUB_SHA is the tagged commit; for manual runs
          # it is dev HEAD, so verify against the immutable tag itself.
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION_TAG^{commit}")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
      - name: Build and test offline Fedora RPM
        run: |
          bash scripts/build-rpm.sh
          bash scripts/check-built-rpm.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Generate release notes
        env:
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          {
            echo "# Evidence Note Board $VERSION_TAG"
            echo
            echo "Fedora 44 GNOME Shell 50 / GNOME Classic Wayland."
            echo "RPM must be enabled as a per-user GNOME extension after installation."
            echo "Back up existing notes and remove development ~/.local overrides before switching."
            echo "No SQLite schema changes; uninstall preserves user data."
            echo
            echo "## Recent commits"
            git log --format='- %s' -n 30
            echo
            echo "SHA-256 hashes for all release artifacts are in SHA256SUMS."
            echo "RPM is not cryptographically signed with an RPM signing key."
          } > release-notes.md
      - name: Publish GitHub Release only after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION_TAG" \
            dist/evidence-note-board-[0-9]*.x86_64.rpm \
            dist/evidence-note-board-[0-9]*.src.rpm \
            dist/*-gnome50.zip \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Evidence Note Board $VERSION_TAG" \
            --notes-file release-notes.md
